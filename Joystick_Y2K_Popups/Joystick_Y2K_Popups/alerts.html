<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Tahoma,Verdana,sans-serif;overflow:hidden}.stage{width:800px;height:260px;display:grid;place-items:center;position:relative}.window{width:560px;border:2px solid #fff;border-radius:12px;overflow:hidden;background:linear-gradient(130deg,#ffe0f7,#e2d5ff 55%,#c2f8ff);box-shadow:0 0 0 3px #fa5ac8,0 0 30px #ff55cf88,0 12px 30px #27165877;opacity:0;transform:translateY(30px) scale(.8)}.bar{background:linear-gradient(90deg,#f846ae,#9853ee,#36cafa);padding:9px 14px;color:white;font-size:14px;font-weight:bold;text-shadow:1px 1px #713a95;display:flex;justify-content:space-between}.body{display:flex;gap:17px;align-items:center;padding:23px 25px}.symbol{font-size:53px;filter:drop-shadow(0 0 8px #f69);animation:beat .6s infinite alternate}.name{font-size:25px;font-weight:bold;color:#6e328d;max-width:410px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event{color:#c12c98;font-size:16px;font-weight:bold;letter-spacing:1px;margin-top:6px}.spark{position:absolute;font-size:25px;color:#fff;text-shadow:0 0 12px #f0f,0 0 20px #37dafa;opacity:0}.a{left:95px;top:45px}.b{right:105px;top:30px}.c{right:120px;bottom:32px}.stage.play .window{animation:appear 5s forwards}.stage.play .spark{animation:twinkle .45s 10 alternate}@keyframes appear{0%,8%{opacity:0;transform:translateY(30px) scale(.8)}18%,82%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-25px) scale(.96)}}@keyframes beat{to{transform:scale(1.13)}}@keyframes twinkle{to{opacity:1;transform:rotate(30deg) scale(1.3)}}</style></head><body><div class="stage" id="stage"><span class="spark a">✦</span><span class="spark b">✧</span><span class="spark c">✦</span><div class="window"><div class="bar"><span>♡ DannyGrey Messenger — Incoming Notification</span><span>×</span></div><div class="body"><div class="symbol" id="symbol">♥</div><div><div class="name" id="username">NEW VIEWER</div><div class="event" id="event">JUST FOLLOWED ♡</div></div></div></div></div><script>const events={follow:['♥','JUST FOLLOWED ♡'],sub:['💎','NEW SUBSCRIBER!'],renew:['💕','SUBSCRIBED AGAIN!'],tip:['✦','SENT A TIP!'],medium:['💰','MEDIUM TIP!'],large:['🌟','BIG TIP!'],wheel:['🎡','SPIN THE WHEEL!'],wave:['🌊','WAVE PATTERN!'],pulse:['💗','PULSE PATTERN!'],earthquake:['⚡','EARTHQUAKE PATTERN!'],fireworks:['🎆','FIREWORKS PATTERN!'],random:['🎲','RANDOM MODE!'],gush:['💗','GUSH 2 REQUEST!'],hush:['💜','HUSH 2 REQUEST!']};function show(type='follow',name='NEW VIEWER'){let x=events[type]||events.tip;document.getElementById('symbol').textContent=x[0];document.getElementById('event').textContent=x[1];document.getElementById('username').textContent=String(name).slice(0,45);let s=document.getElementById('stage');s.classList.remove('play');void s.offsetWidth;s.classList.add('play')}window.addEventListener('message',e=>{if(e.data&&e.data.type==='y2k-alert')show(e.data.event,e.data.username||'NEW VIEWER')});const p=new URLSearchParams(location.search);if(p.has('demo')){show(p.get('demo'),p.get('name')||'TEST VIEWER')}window.showY2KAlert=show;</script></body></html>
